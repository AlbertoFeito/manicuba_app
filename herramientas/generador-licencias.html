<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generador de licencias · ManiCuba</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 560px; margin: 0 auto; padding: 24px; line-height: 1.5;
      }
      h1 { color: #e91e63; font-size: 1.4rem; margin: 0 0 8px 0; }
      .subtitle { color: #888; font-size: 0.9rem; margin: 0 0 24px 0; }
      label { display: block; margin-top: 16px; font-weight: 600; }
      input {
        width: 100%; box-sizing: border-box; padding: 12px; font-size: 1rem;
        margin-top: 6px; border: 1px solid #bbb; border-radius: 8px;
        letter-spacing: 1px;
      }
      input:focus { outline: none; border-color: #e91e63; box-shadow: 0 0 0 3px rgba(233,30,99,.1); }
      button {
        margin-top: 20px; width: 100%; padding: 14px; font-size: 1rem;
        background: #e91e63; color: #fff; border: 0; border-radius: 10px;
        cursor: pointer; font-weight: 600; transition: background 0.2s;
      }
      button:hover { background: #c2185b; }
      button:active { transform: scale(0.98); }
      .out {
        margin-top: 20px; padding: 16px; border-radius: 10px;
        background: rgba(233,30,99,.08); border: 1px solid #e91e63;
        display: none;
      }
      .out.show { display: block; }
      .titulo-eq { color: #888; font-size: 0.9rem; margin-bottom: 4px; }
      .code {
        font-size: 1.8rem; font-weight: 700; letter-spacing: 3px;
        word-break: break-all; margin: 12px 0 16px; font-family: 'Monaco', 'Courier New', monospace;
        padding: 12px; background: rgba(255,255,255,.5); border-radius: 6px;
      }
      .muted { color: #888; font-size: .9rem; }
      .warn { color: #c62828; font-size: .9rem; margin-top: 8px; font-weight: 600; }
      .success { color: #2e7d32; font-size: .9rem; margin-top: 8px; }
      .info { color: #1565c0; font-size: .9rem; margin-top: 12px; }
      #copy { margin-top: 0; }
    </style>
  </head>
  <body>
    <h1>💅 ManiCuba · Generador de Licencias</h1>
    <p class="subtitle">Herramienta offline para el vendedor</p>

    <p class="muted">
      Introduce el <b>secreto de producción</b> y el <b>código de equipo</b> que te
      envía la clienta. No compartas esta página ni el secreto.
    </p>

    <label for="secret">🔐 Secreto de Producción</label>
    <input id="secret" type="text" placeholder="secreto-produccion-xyz" />
    <p class="info" id="secretHint">Secreto por defecto (desarrollo): manicuba-dev-secret</p>

    <label for="device">📱 Código de Equipo</label>
    <input id="device" type="text" placeholder="7K3M9-2QXBD" />

    <button id="gen">🔓 Generar Licencia</button>

    <div class="out" id="out">
      <div class="titulo-eq">Licencia para <span id="eq"></span>:</div>
      <div class="code" id="lic"></div>
      <button id="copy">✓ Copiar al portapapeles</button>
      <div class="warn" id="warn"></div>
      <div class="success" id="success" style="display:none">✓ ¡Licencia copiada!</div>
    </div>

    <script>
      const ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
      const LICENCE_CHARS = 16;

      function toBase32(bytes, length) {
        let bits = 0, value = 0, out = '';
        for (const byte of bytes) {
          value = ((value << 8) | byte) >>> 0;
          bits += 8;
          while (bits >= 5) {
            out += ALPHABET[(value >>> (bits - 5)) & 31];
            bits -= 5;
            value = value & ((1 << bits) - 1);
            if (out.length === length) return out;
          }
        }
        return out.padEnd(length, ALPHABET[0]);
      }
      function normalizeCode(raw) {
        return (raw || '').toUpperCase().replace(/[^0-9A-Z]/g, '')
          .replace(/[IL]/g, '1').replace(/O/g, '0');
      }
      function group(code, size) {
        return (code.match(new RegExp(`.{1,${size}}`, 'g')) || []).join('-');
      }
      async function computeLicence(deviceId, secret) {
        const enc = new TextEncoder();
        const key = await crypto.subtle.importKey(
          'raw', enc.encode(secret),
          { name: 'HMAC', hash: 'SHA-256' }, false, ['sign'],
        );
        const sig = await crypto.subtle.sign(
          'HMAC', key, enc.encode(`manicuba:v1:${normalizeCode(deviceId)}`),
        );
        return toBase32(new Uint8Array(sig), LICENCE_CHARS);
      }

      const $ = (id) => document.getElementById(id);
      const dev_secret = 'manicuba-dev-secret';

      // Pre-llenar el campo de secreto con el secreto de desarrollo
      $('secret').value = dev_secret;

      $('gen').addEventListener('click', async () => {
        const secret = $('secret').value.trim();
        const device = normalizeCode($('device').value);

        if (!secret) {
          alert('Escribe el secreto de produccion.');
          return;
        }
        if (!device) {
          alert('Escribe el codigo de equipo.');
          return;
        }

        const lic = await computeLicence(device, secret);
        $('eq').textContent = group(device, 5);
        $('lic').textContent = group(lic, 4);
        $('success').style.display = 'none';

        // Mostrar advertencia si usa el secreto de desarrollo
        if (secret === dev_secret) {
          $('warn').textContent = '⚠️ AVISO: Secreto de desarrollo. No vale para vender.';
        } else {
          $('warn').textContent = '';
        }

        $('out').classList.add('show');
      });

      $('copy').addEventListener('click', async () => {
        const texto = $('lic').textContent.replace(/-/g, '');
        try {
          await navigator.clipboard.writeText(texto);

          // Feedback visual
          const btn = $('copy');
          const textOriginal = btn.textContent;
          btn.textContent = '✓ ¡Copiado!';
          btn.style.background = '#2e7d32';

          // Restaurar despues de 2 segundos
          setTimeout(() => {
            btn.textContent = textOriginal;
            btn.style.background = '';
            $('success').style.display = 'block';
          }, 2000);
        } catch (err) {
          alert('Error al copiar: ' + err.message);
        }
      });

      // Permitir Enter para generar
      $('device').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          $('gen').click();
        }
      });
    </script>
  </body>
</html>
