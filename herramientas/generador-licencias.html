<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generador de licencias · ManiCuba / PeluCuba</title>
    <style>
      :root { color-scheme: light dark; --acento: #e91e63; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 560px; margin: 0 auto; padding: 24px; line-height: 1.5;
      }
      h1 { color: var(--acento); font-size: 1.4rem; }
      label { display: block; margin-top: 16px; font-weight: 600; }
      input, select {
        width: 100%; box-sizing: border-box; padding: 12px; font-size: 1rem;
        margin-top: 6px; border: 1px solid #bbb; border-radius: 8px;
      }
      input { letter-spacing: 1px; }
      button {
        margin-top: 20px; width: 100%; padding: 14px; font-size: 1rem;
        background: var(--acento); color: #fff; border: 0; border-radius: 10px;
        cursor: pointer; font-weight: 600;
      }
      button.sec { background: #fff; color: var(--acento); border: 1px solid var(--acento); }
      button.ok { background: #2e7d32 !important; color: #fff !important; }
      .out {
        margin-top: 20px; padding: 16px; border-radius: 10px;
        background: color-mix(in srgb, var(--acento) 8%, transparent);
        border: 1px solid var(--acento); display: none;
      }
      .out.show { display: block; }
      .app { font-weight: 700; color: var(--acento); margin-bottom: 8px; }
      .code {
        font-size: 1.6rem; font-weight: 700; letter-spacing: 2px;
        word-break: break-all; margin: 6px 0 12px;
      }
      .row { display: flex; gap: 10px; }
      .row button { margin-top: 0; }
      .muted { color: #888; font-size: .9rem; }
      .warn { color: #c62828; font-size: .9rem; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1 id="titulo">💅 Generador de licencias · ManiCuba</h1>
    <p class="muted">
      Herramienta <b>offline</b> para el vendedor, común a todas las apps.
      Elige la app, introduce su <b>secreto</b> (el mismo con el que se compiló
      el APK) y el <b>código de equipo</b> que te envía la clienta. No compartas
      esta página ni el secreto.
    </p>

    <label for="app">App</label>
    <select id="app">
      <option value="manicuba">💅 ManiCuba</option>
      <option value="pelucuba">💇 PeluCuba</option>
    </select>

    <label for="secret">Secreto</label>
    <input id="secret" type="text" placeholder="tu-secreto-de-produccion" />

    <label for="cliente">Nombre de la clienta (opcional)</label>
    <input id="cliente" type="text" placeholder="Ej. María Pérez" />

    <label for="device">Código de equipo</label>
    <input id="device" type="text" placeholder="7K3M9-2QXBD" />

    <button id="gen">Generar licencia</button>

    <div class="out" id="out">
      <div class="app" id="appline"></div>
      <div class="muted" id="clienteline"></div>
      <div class="muted">Equipo <span id="eq"></span> · Licencia:</div>
      <div class="code" id="lic"></div>
      <div class="row">
        <button id="copyLic" class="sec">Copiar licencia</button>
        <button id="copyMsg">Copiar mensaje</button>
      </div>
      <div class="warn" id="warn"></div>
    </div>

    <script>
      // Todas las apps comparten EXACTAMENTE el mismo algoritmo (prefijo
      // 'manicuba:v1:'); lo único que cambia entre apps es el secreto. El
      // selector solo ajusta marca, color y el secreto de desarrollo por
      // defecto — la licencia depende del secreto que escribas.
      const APPS = {
        manicuba: { nombre: 'ManiCuba', emoji: '💅', color: '#e91e63', dev: 'manicuba-dev-secret' },
        pelucuba: { nombre: 'PeluCuba', emoji: '💇', color: '#6a1b9a', dev: 'pelucuba-dev-secret' },
      };
      const DEV_SECRETS = Object.values(APPS).map((a) => a.dev);

      const ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
      const LICENCE_CHARS = 16;

      function toBase32(bytes, length) {
        let bits = 0, value = 0, out = '';
        for (const byte of bytes) {
          value = ((value << 8) | byte) >>> 0;
          bits += 8;
          while (bits >= 5) {
            out += ALPHABET[(value >>> (bits - 5)) & 31];
            bits -= 5;
            value = value & ((1 << bits) - 1);
            if (out.length === length) return out;
          }
        }
        return out.padEnd(length, ALPHABET[0]);
      }
      function normalizeCode(raw) {
        return (raw || '').toUpperCase().replace(/[^0-9A-Z]/g, '')
          .replace(/[IL]/g, '1').replace(/O/g, '0');
      }
      function group(code, size) {
        return (code.match(new RegExp(`.{1,${size}}`, 'g')) || []).join('-');
      }
      async function computeLicence(deviceId, secret) {
        const enc = new TextEncoder();
        const key = await crypto.subtle.importKey(
          'raw', enc.encode(secret),
          { name: 'HMAC', hash: 'SHA-256' }, false, ['sign'],
        );
        const sig = await crypto.subtle.sign(
          'HMAC', key, enc.encode(`manicuba:v1:${normalizeCode(deviceId)}`),
        );
        return toBase32(new Uint8Array(sig), LICENCE_CHARS);
      }

      // Copia robusta: portapapeles moderno si hay contexto seguro y, si no
      // (típico al abrir el HTML como archivo local), respaldo con textarea.
      async function copiarTexto(texto) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(texto);
            return true;
          }
        } catch (e) { /* respaldo */ }
        try {
          const ta = document.createElement('textarea');
          ta.value = texto;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-1000px';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (e) {
          return false;
        }
      }
      async function copiarConAviso(texto, btn) {
        const original = btn.textContent;
        const ok = await copiarTexto(texto);
        btn.textContent = ok ? '✓ Copiado' : 'Selecciónalo y cópialo a mano';
        btn.classList.toggle('ok', ok);
        setTimeout(() => { btn.textContent = original; btn.classList.remove('ok'); }, 1800);
      }

      const $ = (id) => document.getElementById(id);
      let ultimaLic = '';
      let ultimoMensaje = '';

      function appActual() { return APPS[$('app').value]; }

      function aplicarApp() {
        const a = appActual();
        document.documentElement.style.setProperty('--acento', a.color);
        $('titulo').textContent = `${a.emoji} Generador de licencias · ${a.nombre}`;
        $('secret').placeholder = `secreto de ${a.nombre} (ej. ${a.dev})`;
      }
      $('app').addEventListener('change', aplicarApp);
      aplicarApp();

      $('gen').addEventListener('click', async () => {
        const a = appActual();
        const secret = $('secret').value.trim();
        const device = normalizeCode($('device').value);
        const cliente = $('cliente').value.trim();
        if (!secret || !device) {
          alert('Escribe el secreto y el código de equipo.');
          return;
        }
        const lic = await computeLicence(device, secret);
        const eq = group(device, 5);
        const licFmt = group(lic, 4);

        ultimaLic = licFmt;
        ultimoMensaje =
          `${a.nombre} ${a.emoji} — Licencia\n` +
          (cliente ? `Cliente: ${cliente}\n` : '') +
          `Equipo: ${eq}\n` +
          `Licencia: ${licFmt}`;

        $('appline').textContent = `${a.nombre} ${a.emoji} — Licencia`;
        $('clienteline').textContent = cliente ? `Cliente: ${cliente}` : '';
        $('clienteline').style.display = cliente ? 'block' : 'none';
        $('eq').textContent = eq;
        $('lic').textContent = licFmt;
        $('warn').textContent = DEV_SECRETS.includes(secret)
          ? 'AVISO: es un secreto de desarrollo, no sirve para vender.' : '';
        $('out').classList.add('show');
      });

      $('copyLic').addEventListener('click', (e) => {
        if (ultimaLic) copiarConAviso(ultimaLic, e.currentTarget);
      });
      $('copyMsg').addEventListener('click', (e) => {
        if (ultimoMensaje) copiarConAviso(ultimoMensaje, e.currentTarget);
      });
    </script>
  </body>
</html>
