name: manicuba_app
description: App de gestión de manicura con redes sociales - Offline first
publish_to: 'none'
version: 1.2.1+15

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Base de datos
  sqflite: ^2.4.1
  path: ^1.9.0

  # UI/UX
  intl: ^0.19.0
  table_calendar: ^3.1.2
  fl_chart: ^0.69.2

  # Storage & Compartir
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  file_picker: ^8.1.6

  # Utilidades
  uuid: ^4.5.1
  decimal: ^3.0.2
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_lints: ^4.0.0
  json_serializable: ^6.9.0
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.14.1

# Configuración del icono de la app (manicura).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#E91E63"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
