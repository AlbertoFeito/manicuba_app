name: multiservicios_app
description: App de gestión para salones de servicios (manicura, peluquería, spa y más) - Offline first
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Base de datos
  sqflite: ^2.4.1
  path: ^1.9.0

  # UI/UX
  intl: ^0.19.0
  table_calendar: ^3.1.2
  fl_chart: ^0.69.2

  # Storage & Compartir
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  file_picker: ^8.1.6

  # Utilidades
  uuid: ^4.5.1
  decimal: ^3.0.2
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_lints: ^4.0.0
  json_serializable: ^6.9.0
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.14.1
  # Interfaces de plataforma usadas por los mocks de los tests
  # (path_provider y share_plus). Ya vienen como dependencias transitivas;
  # se declaran aquí para poder importarlas explícitamente en test/.
  plugin_platform_interface: ^2.1.8
  path_provider_platform_interface: ^2.1.2
  share_plus_platform_interface: ^5.0.2

# Configuración del icono de la app. Ícono neutral: el tema visual dentro
# de la app cambia según el rubro elegido (ver lib/config/business_config.dart),
# pero el ícono del launcher es fijo, igual para todos los rubros.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#3949AB"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
